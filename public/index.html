<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Browser UI colour (matches the site's navy) -->
    <meta name="theme-color" content="#102732" />

    <!-- Icons and manifest (files live in /public) -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Fonts: connect early so Montserrat loads faster -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Search engines -->
    <title>AppVia | Business Operations App Solutions</title>
    <meta
      name="description"
      content="AppVia builds custom Mini ERP and business operations apps for small and medium businesses: inventory, CRM, billing, attendance, orders and dashboards. Based in Ludhiana, Punjab, India."
    />
    <meta
      name="keywords"
      content="Mini ERP, business app, custom software, inventory management, billing software, CRM, Ludhiana, Punjab, India, AppVia"
    />
    <meta name="author" content="AppVia" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://appvia.in/" />

    <!-- Link previews (WhatsApp, LinkedIn, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AppVia" />
    <meta property="og:title" content="AppVia | Smarter Tools. Stronger Business." />
    <meta
      property="og:description"
      content="Custom business operations apps that automate routine tasks, organize your data and help your company grow."
    />
    <meta property="og:url" content="https://appvia.in/" />
    <meta property="og:image" content="https://appvia.in/appvia-poster.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Structured data so Google can show your business details -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "AppVia",
        "description": "Custom Mini ERP and business operations app solutions for small and medium businesses.",
        "url": "https://appvia.in/",
        "email": "vikrant@appvia.in",
        "telephone": "+919901920560",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Ludhiana",
          "addressRegion": "Punjab",
          "addressCountry": "IN"
        }
      }
    </script>

    <style>
      /* Shown for a moment before React loads, so the page never flashes white */
      html, body { margin: 0; background: #102732; }
      #root:empty { min-height: 100vh; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
